name: CI

on:
  push:
    branches: [main, work/forgedeps-integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ariatools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CI scripts print UTF-8 diagnostics; a Windows console defaults
  # to cp1252 and raises UnicodeEncodeError on them.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # Candidate source is explicit; published dependency locks remain unchanged.
  # The reviewed Aria source is the released tag the dependency lock names.
  ARIA_SDK_SOURCE: ${{ github.workspace }}/build/aria-candidate
  GCC_VERSION: "16"
  LLVM_VERSION: "23"
  PYTHON_VERSION: "3.14"

jobs:
  dependency-contracts:
    name: Dependency contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        # Container jobs bring their own interpreter.
        if: env.VIRTUAL_ENV == ''
        with:
          python-version: '3.14'
      - name: Checkout reviewed Aria SDK candidate
        uses: actions/checkout@v7
        with:
          repository: dqsjqian/Aria
          ref: v3.2.5
          path: build/aria-candidate
          persist-credentials: false
      - name: Install shared dependency tooling
        run: python -m pip install --break-system-packages -r requirements-build.txt
      - name: Initialize shared dependency workspace
        run: |
          python -m forgedeps init "$RUNNER_TEMP/forgedeps"
          echo "FORGEDEPS_HOME=$RUNNER_TEMP/forgedeps" >> "$GITHUB_ENV"
      - name: Verify selection, rollback and cache contracts
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'

  dependency-fetcher:
    name: Dependency fetcher safety regressions
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        # Container jobs bring their own interpreter.
        if: env.VIRTUAL_ENV == ''
        with:
          python-version: '3.14'
      - name: Checkout reviewed Aria SDK candidate
        uses: actions/checkout@v7
        with:
          repository: dqsjqian/Aria
          ref: v3.2.5
          path: build/aria-candidate
          persist-credentials: false
      - name: Install shared dependency tooling
        run: python -m pip install --break-system-packages -r requirements-build.txt
      - name: Initialize shared dependency workspace
        run: |
          python -m forgedeps init "$RUNNER_TEMP/forgedeps"
          echo "FORGEDEPS_HOME=$RUNNER_TEMP/forgedeps" >> "$GITHUB_ENV"
      - name: Test local dependency transactions
        run: python scripts/ci/test_fetch_aria.py
      - name: Test selected JSON header staging
        run: python scripts/ci/test_stage_json_headers.py

  vs2026:
    name: Qt and Web (VS2026 MSVC)
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        # Container jobs bring their own interpreter.
        if: env.VIRTUAL_ENV == ''
        with:
          python-version: '3.14'
      - name: Checkout reviewed Aria SDK candidate
        uses: actions/checkout@v7
        with:
          repository: dqsjqian/Aria
          ref: v3.2.5
          path: build/aria-candidate
          persist-credentials: false
      - name: Install shared dependency tooling
        run: |
          $pythonExe = Join-Path $env:pythonLocation "python.exe"
          & $pythonExe -m pip install --break-system-packages -r requirements-build.txt
          "FORGEDEPS_PYTHON_EXECUTABLE=$pythonExe" >> $env:GITHUB_ENV
      - name: Initialize shared dependency workspace
        run: |
          & "$env:FORGEDEPS_PYTHON_EXECUTABLE" -m forgedeps init "$RUNNER_TEMP/forgedeps"
          echo "FORGEDEPS_HOME=$RUNNER_TEMP/forgedeps" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Validate Windows build scripts
        run: |
          foreach ($script in Get-ChildItem Workbench/scripts/*.ps1) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          . ./Workbench/scripts/msvc-env.ps1
          if (-not (Initialize-MsvcToolchain)) { throw "MSVC/Windows SDK discovery failed" }
      - name: Configure and build with Visual Studio 2026
        run: |
          python scripts/build.py --platform qt --build-dir build/ci-vs2026 --generator "Visual Studio 18 2026" --generator-platform x64 --jobs 3
      - name: Probe Qt views
        env:
          QT_QPA_PLATFORM: offscreen
        # Exercise the deployed plugins without install-qt-action's fallback
        # path. Keep a hard timeout for unattended GUI startup failures.
        run: |
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          $platforms = (Resolve-Path "./build/ci-vs2026/bin/Release/platforms").Path
          if (-not (Test-Path "$platforms/qoffscreen.dll")) { throw "Deployed offscreen plugin is missing" }
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = $platforms
          $env:QT_QPA_PLATFORM = "offscreen"
          & "$env:FORGEDEPS_PYTHON_EXECUTABLE" -m forgedeps.build_kit.session --build-dir build/ci-vs2026 -- "$env:FORGEDEPS_PYTHON_EXECUTABLE" scripts/ci/run_probe.py ./build/ci-vs2026/bin/Release/workbench.exe
      - name: Run standalone module tests
        run: |
          foreach ($module in @('calendar', 'cart', 'dashboard', 'frameworklab', 'notes', 'tools')) {
            $build = "build/ci-vs2026-test-$module"
            python -m forgedeps.build_kit.session --configure -- cmake -S "Workbench/modules/$module/tests" -B $build -G "Visual Studio 18 2026" -A x64
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            python -m forgedeps.build_kit.session --build-dir $build -- cmake --build $build --config Release --parallel 3
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $env:PATH = "$(Resolve-Path "$build/bin/Release");$env:PATH"
            python -m forgedeps.build_kit.session --build-dir $build -- ctest --test-dir $build -C Release --output-on-failure --no-tests=error
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Build and probe Web shell
        run: |
          python -m forgedeps.build_kit.session --configure -- cmake -S Workbench -B build/ci-vs2026-web -G "Visual Studio 18 2026" -A x64 -DWORKBENCH_TARGET_WEB=ON -DWORKBENCH_TARGET_QT=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m forgedeps.build_kit.session --build-dir build/ci-vs2026-web -- cmake --build build/ci-vs2026-web --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m forgedeps.build_kit.session --build-dir build/ci-vs2026-web -- python scripts/ci/run_probe.py ./build/ci-vs2026-web/bin/Release/workbench_web.exe

  windows:
    name: Qt and Web probes (Windows UCRT64)
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        # Container jobs bring their own interpreter.
        if: env.VIRTUAL_ENV == ''
        with:
          python-version: '3.14'
      - name: Checkout reviewed Aria SDK candidate
        uses: actions/checkout@v7
        with:
          repository: dqsjqian/Aria
          ref: v3.2.5
          path: build/aria-candidate
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
      # Qt for MinGW comes from the upstream build rather than the MSYS2
      # package: the packaged Qt creates its EntryPointMinGW32 imported target
      # unconditionally, so any consumer that finds Qt6 with Widgets aborts with
      # "add_library cannot create imported target".
      - name: Install Qt 6.10.3 for MinGW
        shell: pwsh
        run: |
          python -m pip install --quiet "aqtinstall==3.3.*"
          python -m aqt install-qt windows desktop 6.10.3 win64_mingw --archives qtbase --outputdir "$env:RUNNER_TEMP\qt"
          $root = "$env:RUNNER_TEMP\qt\6.10.3\mingw_64"
          "QT_ROOT_WIN=$root" >> $env:GITHUB_ENV
      - name: Install shared dependency tooling
        run: |
          python -m pip install --break-system-packages -r requirements-build.txt
          # The MSYS2 shell's python has the tooling; CMake runs outside that
          # shell, so name the same interpreter for it.
          echo "FORGEDEPS_PYTHON_EXECUTABLE=$(cygpath -w "$(command -v python)")" >> "$GITHUB_ENV"
      - name: Initialize shared dependency workspace
        run: |
          python -m forgedeps init "$RUNNER_TEMP/forgedeps"
          echo "FORGEDEPS_HOME=$RUNNER_TEMP/forgedeps" >> "$GITHUB_ENV"
      - name: Build Qt desktop
        run: |
          python -m forgedeps.build_kit.session --configure -- cmake -S Workbench -B build/ci-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DWORKBENCH_TARGET_QT=ON -DQt6_DIR="$QT_ROOT_WIN/lib/cmake/Qt6"
          python -m forgedeps.build_kit.session --build-dir build/ci-win -- cmake --build build/ci-win --parallel 3
      # The Qt probe must finish within the existing 120-second limit.
      # A timeout or probe failure fails the job, just like the other platforms.
      - name: Stage the Qt platform plugins next to the binaries
        run: |
          mkdir -p build/ci-win/bin/platforms
          cp -f "$(cygpath -u "$QT_ROOT_WIN")/plugins/platforms/qoffscreen.dll" build/ci-win/bin/platforms/
      - name: Probe Qt views
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test -f ./build/ci-win/bin/platforms/qoffscreen.dll
          unset QT_PLUGIN_PATH
          export QT_QPA_PLATFORM_PLUGIN_PATH="$(cygpath -w "$PWD/build/ci-win/bin/platforms")"
          python -m forgedeps.build_kit.session --build-dir build/ci-win -- timeout -s KILL 120 ./build/ci-win/bin/workbench.exe --probe
      - name: Run standalone module tests
        run: |
          for module in calendar cart dashboard frameworklab notes tools; do
            python -m forgedeps.build_kit.session --configure -- cmake -S "Workbench/modules/$module/tests" -B "build/ci-win-test-$module" -G Ninja -DCMAKE_BUILD_TYPE=Release
            python -m forgedeps.build_kit.session --build-dir "build/ci-win-test-$module" -- cmake --build "build/ci-win-test-$module" --parallel 3
            PATH="$PWD/build/ci-win-test-$module/bin:$PATH" python -m forgedeps.build_kit.session --build-dir "build/ci-win-test-$module" -- ctest --test-dir "build/ci-win-test-$module" --output-on-failure --no-tests=error
          done
      - name: Build and probe Web shell
        run: |
          python -m forgedeps.build_kit.session --configure -- cmake -S Workbench -B build/ci-win-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DWORKBENCH_TARGET_WEB=ON -DWORKBENCH_TARGET_QT=OFF
          python -m forgedeps.build_kit.session --build-dir build/ci-win-web -- cmake --build build/ci-win-web --parallel 3
          python -m forgedeps.build_kit.session --build-dir build/ci-win-web -- timeout -s KILL 120 ./build/ci-win-web/bin/workbench_web.exe --probe

  qt:
    name: Qt and Web probes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, container: gcc:16 }
          - { os: xcode-27 }
    container:
      image: ${{ matrix.container || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set up GCC 16, Python and Qt6
        if: matrix.container
        run: .github/scripts/setup-gcc-container.sh qt6-base-dev

      - uses: actions/setup-python@v7
        # Container jobs bring their own interpreter.
        if: env.VIRTUAL_ENV == ''
        with:
          python-version: '3.14'
      - name: Checkout reviewed Aria SDK candidate
        uses: actions/checkout@v7
        with:
          repository: dqsjqian/Aria
          ref: v3.2.5
          path: build/aria-candidate
          persist-credentials: false
      - name: Install shared dependency tooling
        run: python -m pip install --break-system-packages -r requirements-build.txt
      - name: Initialize shared dependency workspace
        run: |
          python -m forgedeps init "$RUNNER_TEMP/forgedeps"
          echo "FORGEDEPS_HOME=$RUNNER_TEMP/forgedeps" >> "$GITHUB_ENV"

      - name: Install macOS toolchain and Qt6
        if: runner.os == 'macOS'
        run: |
          brew install ninja qt
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          python3 scripts/build.py --platform qt --build-dir build/ci-qt \
            --generator Ninja --configure-only --jobs 3

      - name: Build
        run: python -m forgedeps.build_kit.session --build-dir build/ci-qt -- cmake --build build/ci-qt -j

      - name: Run standalone module tests
        run: |
          python3 scripts/build.py --platform qt --build-dir build/ci-qt \
            --generator Ninja --test --jobs 3

      - name: Probe every module and Qt View
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          executable=./build/ci-qt/platform/qt/workbench
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            executable="$executable.app/Contents/MacOS/workbench"
          fi
          python -m forgedeps.build_kit.session --build-dir build/ci-qt -- "$executable" --probe

      - name: Configure and build Web shell
        run: |
          python -m forgedeps.build_kit.session --configure -- cmake -S Workbench -B build/ci-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWORKBENCH_TARGET_WEB=ON \
            -DWORKBENCH_TARGET_QT=OFF
          python -m forgedeps.build_kit.session --build-dir build/ci-web -- cmake --build build/ci-web -j

      - name: Probe HTTP wire protocol and shared TipCalc VM
        run: python -m forgedeps.build_kit.session --build-dir build/ci-web -- ./build/ci-web/bin/workbench_web --probe

  android:
    name: Android Compose + View-backed JNI build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        # Container jobs bring their own interpreter.
        if: env.VIRTUAL_ENV == ''
        with:
          python-version: '3.14'
      - name: Checkout reviewed Aria SDK candidate
        uses: actions/checkout@v7
        with:
          repository: dqsjqian/Aria
          ref: v3.2.5
          path: build/aria-candidate
          persist-credentials: false
      - name: Install shared dependency tooling
        run: python -m pip install --break-system-packages -r requirements-build.txt
      - name: Initialize shared dependency workspace
        run: |
          python -m forgedeps init "$RUNNER_TEMP/forgedeps"
          echo "FORGEDEPS_HOME=$RUNNER_TEMP/forgedeps" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Verify Android locks and install the selected SDK profile
        run: |
          python scripts/ci/android_dependencies.py sdk-packages > /tmp/android-sdk-packages.txt
          mapfile -t packages < /tmp/android-sdk-packages.txt
          sdkmanager "${packages[@]}"

      - name: Build APK (Compose shell + typed JniAdapter Activity)
        run: |
          JOBS=3 bash Workbench/scripts/gen-android.sh --apk

      # 16 KB page size is mandatory for Play uploads targeting Android 15+.
      # The .so is built 16 KB aligned by the NDK, but whether it stays that
      # way inside the APK depends on the packaging step — so assert on the
      # packaged artifact rather than trusting the build.
      - name: Verify native libs are 16 KB aligned in the APK
        run: |
          zipalign=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/zipalign | sort -V | tail -1)
          "$zipalign" -c -P 16 -v 4 \
            Workbench/platform/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS UIKit compile gate
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        # Container jobs bring their own interpreter.
        if: env.VIRTUAL_ENV == ''
        with:
          python-version: '3.14'
      - name: Checkout reviewed Aria SDK candidate
        uses: actions/checkout@v7
        with:
          repository: dqsjqian/Aria
          ref: v3.2.5
          path: build/aria-candidate
          persist-credentials: false
      - name: Install shared dependency tooling
        run: python -m pip install --break-system-packages -r requirements-build.txt
      - name: Initialize shared dependency workspace
        run: |
          python -m forgedeps init "$RUNNER_TEMP/forgedeps"
          echo "FORGEDEPS_HOME=$RUNNER_TEMP/forgedeps" >> "$GITHUB_ENV"

      - name: Configure simulator target
        run: |
          python -m forgedeps.build_kit.session --configure -- cmake -S Workbench -B build/ci-ios -G Xcode \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=$(uname -m) \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DWORKBENCH_TARGET_IOS=ON \
            -DWORKBENCH_TARGET_QT=OFF

      - name: Build iOS shell and every module View
        run: python -m forgedeps.build_kit.session --build-dir build/ci-ios -- cmake --build build/ci-ios --config Debug --target workbench
