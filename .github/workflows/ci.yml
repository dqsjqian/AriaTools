name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ariatools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-contracts:
    name: Dependency contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Verify selection, rollback and cache contracts
        run: python -m unittest discover -s tools/ci -p 'test_*.py'

  dependency-fetcher:
    name: Dependency fetcher safety regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test local dependency transactions
        run: python tools/ci/test_fetch_aria.py
      - name: Test selected JSON header staging
        run: python tools/ci/test_stage_json_headers.py

  vs2026:
    name: Qt and Web (VS2026 MSVC)
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch pinned Aria
        run: python tools/ci/fetch_aria.py
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Validate Windows build scripts
        run: |
          foreach ($script in Get-ChildItem Workbench/scripts/*.ps1) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          . ./Workbench/scripts/msvc-env.ps1
          if (-not (Initialize-MsvcToolchain)) { throw "MSVC/Windows SDK discovery failed" }
      - name: Configure and build with Visual Studio 2026
        run: |
          cmake -S Workbench -B build/ci-vs2026 -G "Visual Studio 18 2026" -A x64 -DWORKBENCH_TARGET_QT=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/ci-vs2026 --config Release --parallel 3
      - name: Probe Qt views
        env:
          QT_QPA_PLATFORM: offscreen
        # Exercise the deployed plugins without install-qt-action's fallback
        # path. Keep a hard timeout for unattended GUI startup failures.
        run: |
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          $platforms = (Resolve-Path "./build/ci-vs2026/bin/Release/platforms").Path
          if (-not (Test-Path "$platforms/qoffscreen.dll")) { throw "Deployed offscreen plugin is missing" }
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = $platforms
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "./build/ci-vs2026/bin/Release/workbench.exe" -ArgumentList "--probe" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) {
            Write-Host "::error::qt probe timed out after 120s, killing"
            $p.Kill($true)
            exit 124
          }
          if ($null -eq $p.ExitCode) { throw "Qt probe did not report an exit code" }
          exit $p.ExitCode
      - name: Run standalone module tests
        run: |
          foreach ($module in @('calendar', 'cart', 'dashboard', 'frameworklab', 'notes', 'tools')) {
            $build = "build/ci-vs2026-test-$module"
            cmake -S "Workbench/modules/$module/tests" -B $build -G "Visual Studio 18 2026" -A x64
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cmake --build $build --config Release --parallel 3
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $env:PATH = "$(Resolve-Path "$build/bin/Release");$env:PATH"
            ctest --test-dir $build -C Release --output-on-failure --no-tests=error
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Build and probe Web shell
        run: |
          cmake -S Workbench -B build/ci-vs2026-web -G "Visual Studio 18 2026" -A x64 -DWORKBENCH_TARGET_WEB=ON -DWORKBENCH_TARGET_QT=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/ci-vs2026-web --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $p = Start-Process -FilePath "./build/ci-vs2026-web/bin/Release/workbench_web.exe" -ArgumentList "--probe" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) {
            Write-Host "::error::web probe timed out after 120s, killing"
            $p.Kill($true)
            exit 124
          }
          if ($null -eq $p.ExitCode) { throw "Web probe did not report an exit code" }
          exit $p.ExitCode

  windows:
    name: Qt and Web probes (Windows UCRT64)
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
      - name: Fetch pinned Aria
        run: python tools/ci/fetch_aria.py
      - name: Build Qt desktop
        run: |
          cmake -S Workbench -B build/ci-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DWORKBENCH_TARGET_QT=ON
          cmake --build build/ci-win --parallel 3
      # The Qt probe must finish within the existing 120-second limit.
      # A timeout or probe failure fails the job, just like the other platforms.
      - name: Probe Qt views
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test -f ./build/ci-win/bin/platforms/qoffscreen.dll
          unset QT_PLUGIN_PATH
          export QT_QPA_PLATFORM_PLUGIN_PATH="$(cygpath -w "$PWD/build/ci-win/bin/platforms")"
          timeout -s KILL 120 ./build/ci-win/bin/workbench.exe --probe
      - name: Run standalone module tests
        run: |
          for module in calendar cart dashboard frameworklab notes tools; do
            cmake -S "Workbench/modules/$module/tests" -B "build/ci-win-test-$module" -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/ci-win-test-$module" --parallel 3
            PATH="$PWD/build/ci-win-test-$module/bin:$PATH" ctest --test-dir "build/ci-win-test-$module" --output-on-failure --no-tests=error
          done
      - name: Build and probe Web shell
        run: |
          cmake -S Workbench -B build/ci-win-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DWORKBENCH_TARGET_WEB=ON -DWORKBENCH_TARGET_QT=OFF
          cmake --build build/ci-win-web --parallel 3
          timeout -s KILL 120 ./build/ci-win-web/bin/workbench_web.exe --probe

  qt:
    name: Qt and Web probes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Fetch pinned Aria
        run: python tools/ci/fetch_aria.py

      - name: Install Linux toolchain and Qt6
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 qt6-base-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install macOS toolchain and Qt6
        if: runner.os == 'macOS'
        run: |
          brew install ninja qt
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S Workbench -B build/ci-qt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}" \
            -DWORKBENCH_TARGET_QT=ON

      - name: Build
        run: cmake --build build/ci-qt -j

      - name: Run standalone module tests
        run: |
          for module in calendar cart dashboard frameworklab notes tools; do
            cmake -S "Workbench/modules/$module/tests" \
                  -B "build/ci-test-$module" -G Ninja \
                  -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/ci-test-$module" -j
            ctest --test-dir "build/ci-test-$module" --output-on-failure
          done

      - name: Probe every module and Qt View
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          executable=./build/ci-qt/platform/qt/workbench
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            executable="$executable.app/Contents/MacOS/workbench"
          fi
          "$executable" --probe

      - name: Configure and build Web shell
        run: |
          cmake -S Workbench -B build/ci-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWORKBENCH_TARGET_WEB=ON \
            -DWORKBENCH_TARGET_QT=OFF
          cmake --build build/ci-web -j

      - name: Probe HTTP wire protocol and shared TipCalc VM
        run: ./build/ci-web/bin/workbench_web --probe

  android:
    name: Android Compose + View-backed JNI build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch pinned Aria
        run: python tools/ci/fetch_aria.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Verify Android locks and install the selected SDK profile
        run: |
          python tools/ci/android_dependencies.py sdk-packages > /tmp/android-sdk-packages.txt
          mapfile -t packages < /tmp/android-sdk-packages.txt
          sdkmanager "${packages[@]}"

      - name: Build APK (Compose shell + typed JniAdapter Activity)
        run: |
          JOBS=3 bash Workbench/scripts/gen-android.sh --apk

      # 16 KB page size is mandatory for Play uploads targeting Android 15+.
      # The .so is built 16 KB aligned by the NDK, but whether it stays that
      # way inside the APK depends on the packaging step — so assert on the
      # packaged artifact rather than trusting the build.
      - name: Verify native libs are 16 KB aligned in the APK
        run: |
          zipalign=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/zipalign | sort -V | tail -1)
          "$zipalign" -c -P 16 -v 4 \
            Workbench/platform/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS UIKit compile gate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Fetch pinned Aria
        run: python tools/ci/fetch_aria.py

      - name: Configure simulator target
        run: |
          cmake -S Workbench -B build/ci-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=$(uname -m) \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DWORKBENCH_TARGET_IOS=ON \
            -DWORKBENCH_TARGET_QT=OFF

      - name: Build iOS shell and every module View
        run: cmake --build build/ci-ios --config Debug --target workbench
