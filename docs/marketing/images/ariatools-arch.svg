<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <text x="640" y="72" text-anchor="middle" fill="#f8fafc" font-size="44" font-weight="700">AriaTools · 跨平台 MVVM 演示应用</text>
  <text x="640" y="116" text-anchor="middle" fill="#94a3b8" font-size="24">16 个业务模块 · 一套 C++ 逻辑 · Qt / iOS / Android 三端原生渲染</text>

  <g filter="url(#sh)">
    <rect x="60" y="150" width="1160" height="150" rx="18" fill="url(#c1)"/>
    <text x="640" y="186" text-anchor="middle" fill="#083344" font-size="26" font-weight="700">业务模块层 modules/（16 个）</text>
    <text x="640" y="228" text-anchor="middle" fill="#083344" font-size="21">dashboard · notes · calendar · tools · settings · cart · chat · login · search · sync</text>
    <text x="640" y="262" text-anchor="middle" fill="#164e63" font-size="20">tipcalc · unitconvert · theme · signup · wizard · echo</text>
  </g>

  <g filter="url(#sh)">
    <rect x="60" y="330" width="1160" height="150" rx="18" fill="url(#c2)"/>
    <text x="640" y="366" text-anchor="middle" fill="#ede9fe" font-size="26" font-weight="700">契约与机制层 module_api/（框架内核）</text>
    <g text-anchor="middle" fill="#ddd6fe" font-size="21">
      <text x="230" y="414">NavigatorHost 路由</text>
      <text x="520" y="414">MountRegistry 拓展点</text>
      <text x="830" y="414">EventBus 事件总线</text>
      <text x="1080" y="414">capabilities 能力契约</text>
    </g>
    <text x="640" y="458" text-anchor="middle" fill="#c4b5fd" font-size="18">跨模块零耦合：Push&lt;I&gt; / Resolve(slot) / publish-subscribe，全部走接口与 id</text>
  </g>

  <g filter="url(#sh)">
    <rect x="60" y="510" width="1160" height="110" rx="18" fill="#1e293b" stroke="#334155"/>
    <text x="640" y="550" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="600">平台壳 shells（每个平台 5 件套）</text>
    <g text-anchor="middle" fill="#94a3b8" font-size="19">
      <text x="200" y="596">AppShell（装配核心）</text>
      <text x="480" y="596">ViewFactory（按 id 建 View）</text>
      <text x="800" y="596">View 实现（Qt / UIKit / Compose）</text>
      <text x="1085" y="596">JNI side-channel（Android）</text>
    </g>
  </g>
</svg>
