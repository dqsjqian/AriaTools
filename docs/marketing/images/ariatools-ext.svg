<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <defs>
    <linearGradient id="h1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <text x="640" y="74" text-anchor="middle" fill="#f8fafc" font-size="44" font-weight="700">拓展点：模块把 UI 挂到别的模块的槽位</text>
  <text x="640" y="118" text-anchor="middle" fill="#94a3b8" font-size="24">VS Code contributes.views / Eclipse extension-point 模式的 C++ 实现</text>

  <g filter="url(#sh)">
    <rect x="60" y="160" width="340" height="180" rx="18" fill="url(#h1)"/>
    <text x="230" y="200" text-anchor="middle" fill="#083344" font-size="26" font-weight="700">宿主模块（dashboard）</text>
    <text x="230" y="244" text-anchor="middle" fill="#083344" font-size="20">声明槽位并消费</text>
    <rect x="95" y="270" width="270" height="46" rx="10" fill="#0e7490"/>
    <text x="230" y="298" text-anchor="middle" fill="#cffafe" font-size="19" font-family="'SF Mono',Menlo,monospace">slot: dashboard.content</text>
  </g>

  <g filter="url(#sh)">
    <rect x="470" y="160" width="340" height="180" rx="18" fill="#3b82f6"/>
    <text x="640" y="200" text-anchor="middle" fill="#eff6ff" font-size="26" font-weight="700">MountRegistry</text>
    <text x="640" y="244" text-anchor="middle" fill="#dbeafe" font-size="20">Provide / Resolve / SetEnabled</text>
    <text x="640" y="286" text-anchor="middle" fill="#93c5fd" font-size="17">无填充物 → 占位（优雅降级）</text>
  </g>

  <g filter="url(#sh)">
    <rect x="880" y="160" width="340" height="180" rx="18" fill="url(#p1)"/>
    <text x="1050" y="200" text-anchor="middle" fill="#064e3b" font-size="26" font-weight="700">提供者模块（cart）</text>
    <text x="1050" y="244" text-anchor="middle" fill="#064e3b" font-size="20">register_mounts 提供 UI</text>
    <text x="1050" y="288" text-anchor="middle" fill="#065f46" font-size="17">带参数：typed CartArgs / json</text>
  </g>

  <g text-anchor="middle" fill="#e2e8f0">
    <text x="415" y="260" font-size="26">→</text>
    <text x="825" y="260" font-size="26">→</text>
  </g>

  <g filter="url(#sh)">
    <rect x="60" y="396" width="1160" height="130" rx="18" fill="#1e293b" stroke="#334155"/>
    <text x="640" y="432" text-anchor="middle" fill="#e2e8f0" font-size="25" font-weight="600">关键特性</text>
    <g text-anchor="middle" fill="#94a3b8" font-size="20">
      <text x="210" y="478">零耦合：宿主只认槽位 id</text>
      <text x="560" y="478">热切换：SetEnabled 保留 factory</text>
      <text x="940" y="478">共享主 VM：与 tab 数据一致</text>
    </g>
    <text x="640" y="510" text-anchor="middle" fill="#64748b" font-size="17">删掉提供者模块 → 槽位自动空置，不崩 · 与导航正交（Push = 新页面实例，Mount = 常驻面板）</text>
  </g>

  <g filter="url(#sh)">
    <rect x="60" y="560" width="1160" height="110" rx="18" fill="#7c2d12" stroke="#ea580c"/>
    <text x="640" y="600" text-anchor="middle" fill="#fdba74" font-size="25" font-weight="600">演示效果（三端一致）</text>
    <text x="640" y="646" text-anchor="middle" fill="#fed7aa" font-size="20">dashboard 底部直接显示购物车完整 UI（商品/单价/加购/合计）· 点「切换拓展挂载」→ 占位 → 恢复</text>
  </g>
</svg>
